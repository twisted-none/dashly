services:
  caddy:
    image: caddy:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      KEYCLOAK_DOMAIN: ${KEYCLOAK_DOMAIN}
      DASHLY_DOMAIN: ${DASHLY_DOMAIN}
      DASHLY_API_DOMAIN: ${DASHLY_API_DOMAIN}
    networks:
      - dashly_net

  postgresql:
    image: postgres:15
    restart: always
    ports:
      - "${POSTGRES_HOST_BIND:-127.0.0.1}:5433:5432"
    environment:
      POSTGRES_DB: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB_KEYCLOAK: ${POSTGRES_DB_KEYCLOAK}
      POSTGRES_DB_DASHLY: ${POSTGRES_DB_DASHLY}
      TZ: ${TZ}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    networks:
      - dashly_net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  keycloak:
    image: quay.io/keycloak/keycloak:23.0.0
    restart: always
    command: start --import-realm
    environment:
      KC_PROXY: edge
      KC_HOSTNAME: ${KEYCLOAK_HOST}
      KC_HTTP_ENABLED: "true"
      KEYCLOAK_ADMIN: ${KEYCLOAK_ADMIN}
      KEYCLOAK_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD}
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgresql:5432/${POSTGRES_DB_KEYCLOAK}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./keycloak_theme:/opt/keycloak/themes:ro
      - ./keycloak_config:/opt/keycloak/data/import:ro
    depends_on:
      postgresql:
        condition: service_healthy
    networks:
      - dashly_net

  backend:
    build:
      context: ./backend
    restart: always
    environment:
      FRONTEND_URL: ${DASHLY_FRONTEND_URL}
      KEYCLOAK_INTERNAL_URL: http://keycloak:8080
      KEYCLOAK_EXTERNAL_URL: ${KEYCLOAK_URL}
      KEYCLOAK_REALM: ${KEYCLOAK_REALM}
      KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID_BACKEND}
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD_URLENC}@postgresql:5432/${POSTGRES_DB_DASHLY}
    depends_on:
      postgresql:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - dashly_net

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${DASHLY_BACKEND_URL}/api
        VITE_KEYCLOAK_URL: ${KEYCLOAK_URL}
        VITE_KEYCLOAK_REALM: ${KEYCLOAK_REALM}
        VITE_KEYCLOAK_CLIENT_ID: ${KEYCLOAK_CLIENT_ID_FRONTEND}
        VITE_GRAFANA_BASE_URL: ${GRAFANA_BASE_URL}
    restart: always
    depends_on:
      - backend
    networks:
      - dashly_net

networks:
  dashly_net:

volumes:
  caddy_data:
  caddy_config:
  postgres_data:
